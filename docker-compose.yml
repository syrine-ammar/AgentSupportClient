services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./chroma_data:/app/chroma_data
      - hf_cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  client:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    ports: ["8501:8501"]
    volumes:
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy
 

  admin:
    build: .
    command: streamlit run admin/dashboard.py --server.port 8502 --server.address 0.0.0.0 --server.headless true
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    ports: ["8502:8502"]
    volumes:
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf_cache: